name: Publish release

# Runs on every push to main — builds the React app and publishes
# the result to releases/ so installed apps can auto-update.

on:
  push:
    branches: [main]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Allow the workflow to push back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can push back
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-src/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react-src

      - name: Build React app
        run: npm run build
        working-directory: react-src

      - name: Read version from electron/package.json
        id: version
        run: |
          VERSION=$(node -p "require('./electron/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      - name: Update releases/
        run: |
          cp react-src/dist/index.html releases/index.html
          echo "{\"version\":\"${{ steps.version.outputs.version }}\"}" > releases/latest.json
          echo "Updated releases/ with version ${{ steps.version.outputs.version }}"

      - name: Commit and push releases/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/index.html releases/latest.json
          git diff --cached --quiet && echo "No changes to publish" || (
            git commit -m "chore: publish release v${{ steps.version.outputs.version }} [skip ci]"
            git push
          )
