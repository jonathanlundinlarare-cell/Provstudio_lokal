name: Publish release

# Runs on every push to main — builds the React app and publishes
# the result to releases/ so installed apps can auto-update.

on:
  push:
    branches: [main]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    # Allow the workflow to push back to the repo
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can push back
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react-src/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: react-src

      - name: Build React app
        run: npm run build
        working-directory: react-src

      - name: Read version from electron/package.json
        id: version
        run: |
          VERSION=$(node -p "require('./electron/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "App version: $VERSION"

      - name: Update releases/
        run: |
          # Vite outputs the bundled single-file HTML to electron/index.html
          # (see react-src/vite.config.ts → build.outDir = '../electron')
          #
          # Force UTF-8 (no BOM) output. A plain `cp` preserves whatever encoding
          # the source file has — if electron/index.html ever ends up UTF-16 (e.g.
          # written by a Windows tool/PowerShell redirect), the browser decodes the
          # served bundle as garbage and the app boots to a blank white screen with
          # "Uncaught SyntaxError: Invalid or unexpected token". Re-encoding here
          # guarantees the published bundle is always valid UTF-8 regardless of the
          # source encoding.
          node -e "const fs=require('fs');const b=fs.readFileSync('electron/index.html');let html;if(b[0]===0xFF&&b[1]===0xFE){html=b.toString('utf16le');if(html.charCodeAt(0)===0xFEFF)html=html.slice(1);}else if(b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF){html=b.slice(3).toString('utf8');}else{html=b.toString('utf8');}fs.writeFileSync('releases/index.html',html,{encoding:'utf8'});console.log('Wrote releases/index.html as UTF-8, '+Buffer.byteLength(html)+' bytes');"
          echo "{\"version\":\"${{ steps.version.outputs.version }}\"}" > releases/latest.json
          echo "Updated releases/ with version ${{ steps.version.outputs.version }}"

      - name: Commit and push releases/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases/index.html releases/latest.json
          git diff --cached --quiet && echo "No changes to publish" || (
            git commit -m "chore: publish release v${{ steps.version.outputs.version }} [skip ci]"
            git push
          )
